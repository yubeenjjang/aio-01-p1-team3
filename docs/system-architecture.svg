<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">오케퐁터디 시스템 아키텍처</title>
  <desc id="desc">사용자와 관리자 Streamlit, FastAPI, Supabase, Gemini, Redis Pub/Sub, SSE, Swagger의 연결 구조</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 32px "Pretendard", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .lane { font: 700 18px "Pretendard", "Noto Sans KR", sans-serif; fill: #334155; letter-spacing: 1px; }
      .node-title { font: 700 24px "Pretendard", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .node-sub { font: 500 16px "Pretendard", "Noto Sans KR", sans-serif; fill: #475569; }
      .edge { font: 600 15px "Pretendard", "Noto Sans KR", sans-serif; fill: #334155; }
      .note { font: 500 14px "Pretendard", "Noto Sans KR", sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#f8fafc"/>
  <text x="70" y="62" class="title">오케퐁터디 시스템 아키텍처</text>
  <text x="70" y="94" class="note">사용자 활동부터 데이터 저장, AI 분석, 운영 이벤트와 관리자 실시간 갱신까지의 전체 흐름</text>

  <rect x="45" y="130" width="340" height="720" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="415" y="130" width="410" height="720" rx="24" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/>
  <rect x="855" y="130" width="700" height="720" rx="24" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="75" y="175" class="lane">CLIENT</text>
  <text x="445" y="175" class="lane">APPLICATION</text>
  <text x="885" y="175" class="lane">DATA · AI · EVENT</text>

  <!-- Browsers -->
  <rect x="85" y="230" width="260" height="110" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
  <text x="215" y="275" text-anchor="middle" class="node-title">사용자 Browser</text>
  <text x="215" y="308" text-anchor="middle" class="node-sub">학습·스터디·AI 분석</text>

  <rect x="85" y="450" width="260" height="110" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
  <text x="215" y="495" text-anchor="middle" class="node-title">관리자 Browser</text>
  <text x="215" y="528" text-anchor="middle" class="node-sub">대시보드·로그·평가</text>

  <!-- Frontends -->
  <rect x="455" y="220" width="330" height="130" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
  <text x="620" y="268" text-anchor="middle" class="node-title">사용자 Streamlit</text>
  <text x="620" y="302" text-anchor="middle" class="node-sub">frontend_user</text>
  <text x="620" y="327" text-anchor="middle" class="note">REST API 요청</text>

  <rect x="455" y="440" width="330" height="145" rx="20" fill="#ffedd5" stroke="#ea580c" stroke-width="3" filter="url(#shadow)"/>
  <text x="620" y="488" text-anchor="middle" class="node-title">관리자 Streamlit</text>
  <text x="620" y="522" text-anchor="middle" class="node-sub">frontend_admin</text>
  <text x="620" y="550" text-anchor="middle" class="note">REST 조회 + SSE 공용 큐</text>

  <rect x="455" y="690" width="330" height="105" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3" filter="url(#shadow)"/>
  <text x="620" y="735" text-anchor="middle" class="node-title">Swagger UI</text>
  <text x="620" y="767" text-anchor="middle" class="node-sub">OpenAPI 계약·요청 테스트</text>

  <!-- Backend -->
  <rect x="900" y="360" width="300" height="190" rx="24" fill="#ccfbf1" stroke="#0f766e" stroke-width="4" filter="url(#shadow)"/>
  <text x="1050" y="420" text-anchor="middle" class="node-title">FastAPI Backend</text>
  <text x="1050" y="456" text-anchor="middle" class="node-sub">Router · Service · Schema</text>
  <text x="1050" y="488" text-anchor="middle" class="node-sub">운영 로그 · 표준 오류</text>
  <text x="1050" y="520" text-anchor="middle" class="note">REST API · SSE Endpoint</text>

  <!-- External/data nodes -->
  <rect x="1260" y="205" width="245" height="120" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3" filter="url(#shadow)"/>
  <text x="1382" y="250" text-anchor="middle" class="node-title">Gemini API</text>
  <text x="1382" y="282" text-anchor="middle" class="node-sub">AI 분석·멀티턴 코치</text>

  <rect x="1260" y="385" width="245" height="150" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="3" filter="url(#shadow)"/>
  <text x="1382" y="430" text-anchor="middle" class="node-title">Supabase</text>
  <text x="1382" y="465" text-anchor="middle" class="node-sub">PostgreSQL</text>
  <text x="1382" y="495" text-anchor="middle" class="node-sub">Storage</text>
  <text x="1382" y="520" text-anchor="middle" class="note">서비스·로그·이미지 영속 저장</text>

  <rect x="1260" y="635" width="245" height="130" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="3" filter="url(#shadow)"/>
  <text x="1382" y="680" text-anchor="middle" class="node-title">Redis Pub/Sub</text>
  <text x="1382" y="713" text-anchor="middle" class="node-sub">운영 이벤트 전달</text>
  <text x="1382" y="741" text-anchor="middle" class="note">비영속 메시지 채널</text>

  <!-- Connections -->
  <line x1="345" y1="285" x2="445" y2="285" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <line x1="345" y1="505" x2="445" y2="505" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <path d="M785 285 H850 Q875 285 875 310 V405 Q875 430 900 430" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="820" y="270" class="edge">REST</text>

  <path d="M900 495 H850 Q820 495 820 515 H795" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="810" y="550" class="edge">REST + SSE</text>

  <path d="M785 742 H835 Q865 742 865 715 V550 Q865 525 900 525" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="802" y="720" class="edge">OpenAPI</text>

  <path d="M1135 360 V280 Q1135 265 1155 265 H1250" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <text x="1148" y="245" class="edge">분석 요청·응답</text>

  <line x1="1200" y1="455" x2="1250" y2="455" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <path d="M1250 490 H1210" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="1196" y="432" class="edge">CRUD</text>

  <path d="M1100 550 V670 Q1100 700 1130 700 H1250" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="1115" y="684" class="edge">이벤트 발행</text>

  <path d="M1260 735 H1185 Q1150 735 1150 700 V550" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="1166" y="760" class="edge">구독 → SSE</text>

  <text x="70" y="890" class="note">※ SSE 이벤트는 화면 갱신 신호이며, 최신 화면 데이터는 FastAPI 조회 API를 통해 Supabase에서 가져옵니다.</text>
</svg>
